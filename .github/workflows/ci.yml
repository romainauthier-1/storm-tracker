name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test

      - run: yarn build
        env:
          EXPO_PUBLIC_BACKEND_URL: https://storm-tracker-backend.vercel.app
